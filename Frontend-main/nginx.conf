server {
    listen 80;
    server_name localhost;
    sendfile off;
    tcp_nopush off;

    # Docker's embedded DNS server. Without an explicit resolver, nginx resolves
    # an upstream name once at startup and caches the address forever: whenever
    # the api-gateway or messaging-service container is recreated it gets a new
    # IP, and every proxied request then fails with 502 (connect() refused to the
    # stale address) until the frontend container itself is restarted. Pointing
    # proxy_pass at a variable makes nginx re-resolve through this resolver, so
    # the frontend follows the stack automatically.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA routing — serve static files, fallback to index.html
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/* → API Gateway
    location /api/ {
        set $gateway_upstream http://api-gateway:8080;
        proxy_pass $gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy: /dealers → API Gateway (exact match + prefix)
    location = /dealers {
        set $gateway_upstream http://api-gateway:8080;
        proxy_pass $gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dealers/ {
        set $gateway_upstream http://api-gateway:8080;
        proxy_pass $gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-time chat: /ws → messaging-service (direct, not via API Gateway —
    # the WebMVC gateway cannot proxy WebSocket handshakes)
    location /ws {
        set $messaging_upstream http://messaging-service:8101;
        proxy_pass $messaging_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
