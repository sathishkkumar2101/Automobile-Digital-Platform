spring.application.name=messaging-service

server.port=8101

spring.datasource.url=jdbc:postgresql://localhost:5432/messaging
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Shared JWT secret — supplied through the JWT_SECRET environment variable so it
# is identical across the gateway, user-role-service and messaging-service
# without ever being committed. See docker-compose.yml / .env.example.
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:bmw-vehicle-platform}
jwt.audience=${JWT_AUDIENCE:bmw-vehicle-platform-api}

# Shared secret presented to user-role-service on its internal endpoints so it
# can look up user profiles. Different value from JWT_SECRET; see .env.example.
internal.service.secret=${INTERNAL_SERVICE_SECRET}