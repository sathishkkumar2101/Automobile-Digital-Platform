      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "30"
    depends_on:
      eureka-server:
        condition: service_started
      customer:
        condition: service_started
      order:
        condition: service_started
      dealer:
        condition: service_started
      vehicle:
        condition: service_started
      permission-service:
        condition: service_started
      user-role-service:
        condition: service_started
      service-appointment:
        condition: service_started
      messaging:
        condition: service_started
    networks:
      - vehicle-platform-network


  # =========================
  # Frontend
  # =========================

  frontend:
    build:
      context: ../Frontend-main
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - vehicle-platform-network


# =========================
# Volumes
# =========================

volumes:
  order-data:
    name: order-data

  customer-data:
    name: customer-data

  dealer-data:
    name: dealer-data

  vehicle-data:
    name: vehicle-data

  service-appointment-data:
    name: service-appointment-data

  permission-data:
    name: permission-data

  user-role-data:
    name: user-role-data

  messaging-data:
    name: messaging-data


# =========================
# Network
# =========================

networks:
  vehicle-platform-network:
    name: vehicle-platform-network