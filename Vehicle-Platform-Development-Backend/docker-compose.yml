      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "10"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "30"
    depends_on:
      postgres-user-role:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - vehicle-platform-network

  service-appointment:
    build:
      context: ./service-appointment
    container_name: service-appointment
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-service-appointment:5432/service_appointment
