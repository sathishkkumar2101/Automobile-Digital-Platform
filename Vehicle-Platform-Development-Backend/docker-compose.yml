      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "30"
    depends_on:
      postgres-vehicle:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - vehicle-platform-network

  permission-service:
