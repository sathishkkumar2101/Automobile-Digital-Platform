    depends_on:
      postgres-messaging:
        condition: service_healthy
      eureka-server:
        condition: service_started
      user-role-service:
        condition: service_started
      dealer:
        condition: service_started
      customer:
        condition: service_started
    networks:
      - vehicle-platform-network


  # =========================
  # API Gateway
  # =========================

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      JWT_ISSUER: ${JWT_ISSUER:-bmw-vehicle-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bmw-vehicle-platform-api}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env - see .env.example}
      # Register with the container IP rather than its hostname. The hostname is
      # the container id, which changes whenever the container is recreated, and
      # Docker's DNS only knows the *current* one: a stale Eureka entry then
      # sends the gateway to an address that cannot be resolved, and every
      # request fails until the old entry ages out.
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Registration cadence. The default first registration takes ~40s, so a
