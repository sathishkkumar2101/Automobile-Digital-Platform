      # sends the gateway to an address that cannot be resolved, and every
      # request fails until the old entry ages out.
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Registration cadence. The default first registration takes ~40s, so a
      # service that lost its entry (eureka restarted, container replaced) was
      # unroutable for the best part of a minute. Re-register promptly instead.
      EUREKA_CLIENT_INITIAL_INSTANCE_INFO_REPLICATION_INTERVAL_SECONDS: "5"
      EUREKA_INSTANCE_REGISTRY_REFRESH_INTERVAL_SECONDS: "10"
      EUREKA_CLIENT_EUREKA_SERVICE_URL_POLL_INTERVAL_SECONDS: "10"
      # Renew well inside the expiry window: three renewals are missed before an
      # entry is dropped, and a dropped entry is re-added within ~5s.
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "10"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "30"
    depends_on:
      postgres-customer:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - vehicle-platform-network

  dealer:
    build:
      context: ./dealer
    container_name: dealer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dealer:5432/dealer_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Presented on outbound service-to-service calls (see
      # FeignSecurityInterceptor) so this service can reach the
      # /api/internal/** routes that are guarded by the shared secret.
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env - see .env.example}
      # Register with the container IP rather than its hostname. The hostname is
      # the container id, which changes whenever the container is recreated, and
      # Docker's DNS only knows the *current* one: a stale Eureka entry then
