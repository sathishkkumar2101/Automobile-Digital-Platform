spring.application.name=user-role-service

server.port=8092

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_role_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Seed Data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.jpa.defer-datasource-initialization=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# JWT
# The signing key is supplied through the JWT_SECRET environment variable and
# is never committed. See docker-compose.yml / .env.example.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.issuer=${JWT_ISSUER:bmw-vehicle-platform}
jwt.audience=${JWT_AUDIENCE:bmw-vehicle-platform-api}

# Shared secret the API gateway presents on /api/internal/**. Different value
# from JWT_SECRET; see .env.example.
internal.service.secret=${INTERNAL_SERVICE_SECRET}