spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# permission service
spring.cloud.gateway.server.webmvc.routes[0].id=permission-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://permission-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/permissions/**

#user and role service
spring.cloud.gateway.server.webmvc.routes[1].id=user-role-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-role-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**,/api/roles/**,/api/auth/**

#Vehicle service
spring.cloud.gateway.server.webmvc.routes[2].id=vehicle-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://vehicle-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/vehicles/**

#Customer Service
spring.cloud.gateway.server.webmvc.routes[3].id=customer
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://customer
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/customers/**
#Order-Service
spring.cloud.gateway.server.webmvc.routes[4].id=order-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/orders/**
#Dealer-Service
spring.cloud.gateway.server.webmvc.routes[5].id=dealer-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://dealer-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/dealers/**
# Service Appointment
spring.cloud.gateway.server.webmvc.routes[6].id=service-appointment
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://service-appointment
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/appointments/**
# Messaging Service
spring.cloud.gateway.server.webmvc.routes[7].id=messaging-service
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://messaging-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/messages/**

# JWT — the signing key is NOT stored in this repository.
# It is supplied through the JWT_SECRET environment variable (docker-compose.yml
# reads it from .env). Boot fails if it is missing or shorter than 32 chars.
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:bmw-vehicle-platform}
jwt.audience=${JWT_AUDIENCE:bmw-vehicle-platform-api}

# Shared secret the gateway presents to user-role-service and
# permission-service on their internal endpoints. Different value from
# JWT_SECRET; see .env.example.
internal.service.secret=${INTERNAL_SERVICE_SECRET}
# The load balancer caches the service instance list for 35s by default. After a
# service or the registry restarts it kept serving a stale (often empty) list and
# answering 401/500 for requests it should have routed, which made the stack look
# broken long after it was healthy. Five seconds is cheap here and keeps routing
# in step with the registry.
spring.cloud.loadbalancer.cache.ttl=5s
spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.maxAttempts=3
spring.cloud.loadbalancer.retry.nextRetryDelay=200ms
